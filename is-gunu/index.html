<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İş Günü Hesabı · Dijital Çakı</title>
<link rel="icon" href="/icons/dijital-caki.svg">
<link rel="stylesheet" href="/tool.css?v=20261126d">
<link rel="stylesheet" href="/gunluk/style.css?v=1">
<link rel="stylesheet" href="./style.css?v=1">
<link rel="stylesheet" href="/tool-links.css?v=20261126b">
<script src="/theme.js?v=20261126c"></script>
<script type="module" src="./app.js?v=1"></script>
</head>
<body>
<main class="tool daily workdays">
<header>
  <a class="back" href="/#plan">Uygulamalar</a>
  <h1>İş Günü Hesabı</h1>
  <p class="intro">Hafta sonlarını ve seçtiğin tatilleri atlayarak ileri veya geri tarih hesapla.</p>
</header>
<nav class="tool-links" aria-label="Planlama araçları"><a href="../vardiya/">Vardiyayı Takvime Aktar</a></nav>
<form id="work-form" class="panel">
  <div class="fields">
    <label>Başlangıç tarihi<input id="start" type="date" min="0001-01-01" max="9999-12-31" required></label>
    <label>İş günü sayısı<input id="days" type="number" min="0" max="2608614" value="5" required></label>
    <label>Yön<select id="direction"><option value="1">İleri</option><option value="-1">Geri</option></select></label>
  </div>
  <details>
    <summary>Sayılmayacak tatiller</summary>
    <label for="holiday">Tatil tarihi</label>
    <div class="holiday-entry">
      <input id="holiday" type="date" min="0001-01-01" max="9999-12-31">
      <button id="add-holiday" type="button" disabled>Ekle</button>
    </div>
    <ul id="holidays" class="clean"></ul>
  </details>
  <p class="muted">Başlangıç günü sayılmaz. Tatilleri takvime göre tek tek ekleyebilirsin.</p>
  <div class="row"><button class="primary">Hesapla</button></div>
</form>
<p id="status" role="status"></p>
</main>
</body>
</html>
